task: detection

model: RTDETR
criterion: SetCriterion
postprocessor: RTDETRPostProcessor
use_focal_loss: True

RTDETR:
  backbone: GhostNetV2Backbone      # ← 这里是“字符串”类名（不要写成字典）
  encoder: HybridEncoder
  decoder: RTDETRTransformer
  multi_scale: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800]

# 顶层写构造参数（名称与类名一致）
GhostNetV2Backbone:
  model_name: ghostnetv2_100       # 若你类里字段叫 variant/variant_name，按实际改名
  pretrained: true
  out_indices: [2, 3, 4]            # ≈ {8,16,32}

HybridEncoder:
  # ★ 这三值必须匹配 Ghost 的输出通道；先用探针脚本得到真实值再填
  in_channels: [40, 80, 160]
  feat_strides: [8, 16, 32]

  hidden_dim: 192
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 6
  dim_feedforward: 768
  dropout: 0.0
  enc_act: 'gelu'
  pe_temperature: 10000

  expansion: 1.0
  depth_mult: 1.0
  act: 'silu'

  eval_spatial_size: [640, 640]

RTDETRTransformer:
  feat_channels: [192, 192, 192]
  feat_strides: [8, 16, 32]
  hidden_dim: 192
  num_levels: 3
  num_queries: 300
  num_decoder_layers: 3
  num_denoising: 100
  eval_idx: -1
  eval_spatial_size: [640, 640]

RTDETRPostProcessor:
  num_top_queries: 300

SetCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2}
  losses: ['vfl', 'boxes']
  alpha: 0.75
  gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
