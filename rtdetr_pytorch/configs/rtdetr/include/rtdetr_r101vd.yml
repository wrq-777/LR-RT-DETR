# === Backbone + Encoder/Decoder 结构（R101 “vd” 版）===
task: detection
model: RTDETR
criterion: SetCriterion
postprocessor: RTDETRPostProcessor

RTDETR:
  backbone: PResNet
  encoder:  HybridEncoder
  decoder:  RTDETRTransformer
  # 与你现有保持一致的多尺度
  multi_scale: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800]

# ResNet-101-D
PResNet:
  depth: 101
  variant: d
  freeze_at: 0
  return_idx: [1, 2, 3]    # -> C3,C4,C5
  num_stages: 4
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels:   [512, 1024, 2048]   # ★ R101 的 C3/C4/C5
  feat_strides:  [8, 16, 32]

  hidden_dim: 256                    # ★ R50/R101 常用 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: 'gelu'
  pe_temperature: 10000

  expansion: 1.0
  depth_mult: 1.0
  act: 'silu'

  eval_spatial_size: [640, 640]

RTDETRTransformer:
  feat_channels: [256, 256, 256]     # ★ 与 hidden_dim 对齐
  feat_strides:  [8, 16, 32]
  hidden_dim:    256
  num_levels:    3
  num_queries:   300
  num_decoder_layers: 3
  num_denoising: 100
  eval_idx: -1
  eval_spatial_size: [640, 640]

use_focal_loss: True

RTDETRPostProcessor:
  num_top_queries: 300

SetCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2}
  losses: ['vfl', 'boxes']
  alpha: 0.75
  gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
