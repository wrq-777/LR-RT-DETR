use_ema: True 
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000

find_unused_parameters: True 

epoches: 300
clip_max_norm: 0.1

optimizer:
  type: AdamW
  params: 
    - 
      params: 'backbone'
      lr: 0.00001
    - 
      params: '^(?=.*encoder(?=.*bias|.*norm.*weight)).*$'
      weight_decay: 0.
    -
      params: '^(?=.*decoder(?=.*bias|.*norm.*weight)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  # ★ 核心修复：原来是 [1000]，现改为 [80, 120]！
  # 根据日志，模型在 80 轮已经达峰，必须在此处强制学习率衰减乘以 0.1，让 Loss 平稳降落
  milestones: [80, 120]
  gamma: 0.1